<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162238" />
    <meta name="description" content="電車でも学べる、オフライン対応のTypeScript学習アプリ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>TypeScript Train</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="TypeScript Train ホーム">
          <span class="brand-mark">TS</span><span>TypeScript Train</span>
        </a>
        <div class="status"><span class="online-dot" id="network-dot"></span><span id="network-label">確認中</span></div>
      </header>
      <main id="app" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="メインメニュー">
        <a href="#home" data-nav="home">ホーム</a>
        <a href="#learn" data-nav="learn">学ぶ</a>
        <a href="#practice" data-nav="practice">練習</a>
        <a href="#roadmap" data-nav="roadmap">道のり</a>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
